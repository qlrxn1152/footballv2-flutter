name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Create web platform
        run: flutter create --project-name footballv2_flutter --org com.daehoon --platforms web --no-pub .

      - name: Configure web app
        run: |
          chmod +x tool/configure_web.sh
          ./tool/configure_web.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify
        run: |
          flutter analyze
          flutter test

      - name: Build web
        run: >-
          flutter build web --release
          --base-href /footballv2-flutter/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
