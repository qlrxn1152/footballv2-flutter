name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Create web platform
        run: |
          TEMP_WEB_ROOT="$RUNNER_TEMP/footballv2_flutter_web"
          flutter create --project-name footballv2_flutter --org com.daehoon --platforms web --no-pub "$TEMP_WEB_ROOT"
          cp -R "$TEMP_WEB_ROOT/web" .

      - name: Configure web app
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
        run: |
          chmod +x tool/configure_web.sh
          ./tool/configure_web.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify
        run: |
          flutter analyze
          flutter test

      - name: Build web
        run: >-
          flutter build web --release
          --base-href /footballv2-flutter/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
